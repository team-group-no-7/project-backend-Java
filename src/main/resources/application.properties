spring.application.name=backend

# PostgreSQL Database Connection Settings
# Allows group members to override settings using env variables, or falls back to local postgres defaults
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/learnhub_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA / Hibernate Settings
# ddl-auto=update automatically creates/updates database tables based on JPA entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Enable SQL initialization features
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
